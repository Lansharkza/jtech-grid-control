name: checks

on: [push, pull_request]

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static dashboard check
        run: python check.py
      - name: Python syntax
        run: python -m py_compile central_system.py simulator.py healthcheck.py
      - name: Install and import
        run: |
          pip install -r requirements.txt
          python -c "import ast; ast.parse(open('central_system.py').read())"
